<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Long Distance Relationship</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%231b1016' width='16' height='16'/><path fill='%23ff6b9d' d='M8 14 L3 8 A3 3 0 0 1 8 5 A3 3 0 0 1 13 8 Z'/></svg>" />
  <link rel="stylesheet" href="/css/style.css?v=g7q" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="viewport">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="dialogue"></div>
        <canvas id="sprites" width="1280" height="720"></canvas>
        <div id="ui"></div>
        <div id="draw-wrap" hidden>
          <canvas id="drawboard" width="720" height="400"></canvas>
          <div id="eraser-cursor" hidden></div>
        </div>
        <div id="scanlines"></div>
      </div>
      <button id="mute-btn" type="button" aria-label="Toggle sound">♪ ON</button>
      <button id="fullscreen-btn" type="button">FULLSCREEN</button>
    </div>
    <p id="hint" class="desktop-hint">Desktop · two players · WASD / arrows · SPACE · E · ESC</p>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js?v=g7q"></script>
  <script src="/js/input.js?v=g7q"></script>
  <script src="/js/net.js?v=g7q"></script>
  <script src="/js/render.js?v=g7q"></script>
  <script src="/js/ui.js?v=g7q"></script>
  <script src="/js/main.js?v=g7q"></script>
</body>
</html>
